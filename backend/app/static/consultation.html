<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Консультация — SpeechAI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <p class="back-row"><a href="/" class="back-link">← К списку записей</a></p>
        <h1>Карточка консультации</h1>
      </div>
      <div id="auth-bar" class="auth-bar" hidden></div>
    </div>
  </header>

  <main>
    <p id="auth-required" hidden>Требуется вход. Возвращаем на главную…</p>
    <div id="detail-header"></div>
    <div class="tabs">
      <button type="button" data-tab="transcript" class="active">Запись</button>
      <button type="button" data-tab="evaluation">Оценка</button>
    </div>
    <div id="tab-transcript" class="tab-panel"></div>
    <div id="tab-evaluation" class="tab-panel" hidden></div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/detail.js"></script>
</body>
</html>
